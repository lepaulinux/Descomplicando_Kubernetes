apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deploy
  labels:
    env: demo

spec:
  replicas: 3

  selector:
    matchLabels:
      env: demo

  template:
    metadata:
      labels:
        env: demo

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true

            capabilities:
              drop:
                - ALL