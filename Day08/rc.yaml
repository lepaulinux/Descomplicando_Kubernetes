apiVersion: v1
kind: ReplicationController

metadata:
  name: nginx-rc
  labels:
    env: demo

spec:
  replicas: 3

  template:
    metadata:
      labels:
        env: demo

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: nginx

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true

            capabilities:
              drop:
                - ALL
