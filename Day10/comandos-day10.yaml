k get pods -n kube-system

# para pegar os pods do deafult namespaces

k get pods

# declarative mode
kubectl apply -f ns.yaml
k describe ns demo
kubectl delete ns/demo

# imperative mode
kubectl create ns demo 

kubectl create deploy nginx-demo --image=nginx -n demo

kubectl get pods -n demo

# deploy no default namespaces
kubectl create deploy nginx-test --image=nginx 

# acessar o pod em outro namespace
k exec -it -n demo nginx-demo-5c86c7d69f-6rmr5 -- sh

k get pods -n demo -o wide
# ip 10.244.1.5

k get pods -o wide
# ip 10.244.2.5

kubectl scale --replicas=3 deploy/nginx-demo -n demo
k get pods -n demo

k get pods -n demo -o wide
