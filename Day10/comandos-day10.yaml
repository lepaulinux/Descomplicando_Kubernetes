k exec -it nginx-test-6ff8854996-7jffn -- sh

kubectl scale --replicas=3 deploy/nginx-test

k get pods

# expose port 80 for the pods in the namespace demo
kubectl expose -n demo deploy/nginx-demo --name=svc-demo --port 80

# don't forget the namespace to se the new service
k get svc -n demo
# svc-demo   ClusterIP   10.96.93.125   <none>        80/TCP    77s

# expose port 80 para o default namespace
k expose deploy/nginx-test --name=svc-test --port 80
k get svc
# svc-test       ClusterIP   10.96.247.176   <none>        80/TCP         38s

